<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 72" role="img" aria-labelledby="title desc">
  <title id="title">TickMint logo</title>
  <desc id="desc">A colorful market tick waveform beside the TickMint wordmark</desc>
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.48" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <g fill="url(#wave)">
    <rect x="4" y="25" width="8" height="22" rx="4"/>
    <rect x="17" y="16" width="8" height="40" rx="4"/>
    <rect x="30" y="6" width="8" height="60" rx="4"/>
    <rect x="43" y="23" width="8" height="26" rx="4"/>
    <rect x="56" y="12" width="8" height="48" rx="4"/>
    <rect x="69" y="27" width="8" height="18" rx="4"/>
  </g>
  <text x="90" y="47" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0A0F1C">Tick</text>
  <text x="153" y="47" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="url(#mint)">Mint</text>
</svg>
